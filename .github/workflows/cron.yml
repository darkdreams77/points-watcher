name: Daily ILH Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Installer pnpm (OFFICIEL)
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 8
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # 3) Installer les dépendances
      - name: Install dependencies
        run: pnpm install

      # 4) Générer Prisma
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # 5) Lancer le scraper
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORUM_BASE_URL: ${{ secrets.FORUM_BASE_URL }}
          FORUM_SESSION_COOKIE: ${{ secrets.FORUM_SESSION_COOKIE }}
        run: pnpm exec ts-node src/index.ts
